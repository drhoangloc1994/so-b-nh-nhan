<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#102a33;--mute:#5d737c;--line:#dce6ea;--teal:#0e6b6e;--ts:#dcefef;--red:#c2402c;--rs:#fbe4de;--amb:#9a6700;--as:#fbf0d2;--on:#fff;--dt:#1d6fd1;--dts:#e2eefc;--ng:#c27c0e;--ngs:#fdf0d5;--rv:#2c8f5a;--rvs:#e0f3e8;--sh:0 1px 2px rgba(10,40,55,.06),0 8px 24px rgba(10,40,55,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0c181c;--card:#15262b;--ink:#e6f0f1;--mute:#93aab0;--line:#264047;--teal:#4fc1c4;--ts:#18393c;--red:#ff8f7b;--rs:#3d201b;--amb:#f0c25a;--as:#392d10;--on:#06201f;--dt:#6aa8f5;--dts:#16283d;--ng:#f0b64a;--ngs:#392d10;--rv:#5cc890;--rvs:#14352a;--sh:0 1px 2px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dt{--c:var(--dt);--cs:var(--dts)}.ng{--c:var(--ng);--cs:var(--ngs)}.rv{--c:var(--rv);--cs:var(--rvs)}.al{--c:var(--red);--cs:var(--rs)}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
.hero{background:linear-gradient(120deg,#0a4f55,#17939a);color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--sh)}
.hl{display:flex;gap:12px;align-items:center}.hero h1{font-size:21px;margin:0;line-height:1.2}.hs{font-size:12.5px;opacity:.9}
.hb{display:flex;gap:8px}.hbtn,.btn,.chip{display:inline-flex;align-items:center;gap:6px}
.hbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh);border-left:5px solid var(--c,var(--teal))}
.si{width:38px;height:38px;border-radius:11px;background:var(--cs);color:var(--c);display:flex;align-items:center;justify-content:center}
.stat b{display:block;font-size:24px;line-height:1.1;color:var(--c)}.stat span{font-size:12px;color:var(--mute)}
.cols{display:grid;grid-template-columns:350px 1fr;gap:16px}
@media(max-width:800px){.cols{grid-template-columns:1fr}.hm{display:none}}
.sw{position:relative;margin-bottom:10px}.sw .i{position:absolute;left:12px;top:12px;color:var(--mute)}.sw input{padding-left:38px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;width:100%}
.fcs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fc{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--c,var(--ink))}
.fc.on{background:var(--c,var(--teal));color:#fff;border-color:transparent}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.pri{background:linear-gradient(135deg,#0e6b6e,#17939a);border-color:transparent;color:#fff}
.btn.del{color:var(--red)}.btn.ok{color:var(--rv)}
.pt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-left:6px solid var(--c);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh)}
.pt.sel{border-color:var(--c);border-left-width:6px}
.av{width:44px;height:44px;border-radius:50%;background:var(--c,var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.av.big{width:60px;height:60px;font-size:21px}
.pm{min-width:0;flex:1}.d{font-size:13px;color:var(--mute)}.tg{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--cs);color:var(--c);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--mute);font-weight:500}.tag.r{background:var(--rs);color:var(--red);font-weight:700}
.panel{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);overflow:hidden}
.pb{height:7px;background:var(--c);margin:-18px -18px 16px}
.ph0{display:flex;gap:14px;align-items:center}.panel h2{margin:0 0 2px;font-size:21px}.sub{color:var(--mute);font-size:13px}
.chip{background:var(--ts);color:var(--teal);padding:4px 11px;border-radius:99px;font-size:13px;text-decoration:none;margin:6px 6px 0 0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.grid>div{background:var(--bg);border-radius:12px;padding:9px 12px}.grid span{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--mute)}.grid span .i{width:14px;height:14px}
h3{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;color:var(--teal)}
.note{border-top:1px solid var(--line);padding:8px 0}.note small{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.ph button{padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--bg);cursor:pointer;text-align:left;box-shadow:var(--sh)}
.ph img{width:100%;height:120px;object-fit:cover;display:block}
.ph small{display:block;padding:4px 8px;color:var(--mute);font-size:11px;line-height:1.3}.ph small b{color:var(--ink)}
.empty{color:var(--mute);padding:24px;text-align:center}
.lock{max-width:380px;margin:12vh auto 0;background:var(--card);border-radius:18px;padding:24px;box-shadow:var(--sh)}
.lock h1{font-size:22px;margin:0}.lg{margin-bottom:8px}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}label input,label select,label textarea{margin-top:3px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);min-height:22px;margin-top:8px;font-size:14px}
.warn{background:var(--as);color:var(--amb);padding:8px 12px;border-radius:10px;font-size:13px;margin-top:10px}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(560px,94vw);padding:18px;max-height:92vh;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog img.big{width:100%;border-radius:10px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin:12px 0}.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-weight:600;cursor:pointer}.seg button.on{background:var(--card);box-shadow:var(--sh);color:var(--teal)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--bg);border-radius:12px;padding:10px 12px}.k b{display:block;font-size:24px;line-height:1.1}.k span{font-size:12px;color:var(--mute)}
.cur{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.cur>div{background:var(--dts);color:var(--dt);border-radius:12px;padding:10px 12px}.cur b{display:block;font-size:26px;line-height:1.1}.cur span{font-size:12px}
.chart{display:flex;gap:2px;height:130px;margin-top:6px}.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%}.bb{height:calc(100% - 14px);width:100%;display:flex;gap:1px;align-items:flex-end}.bb i{flex:1;border-radius:3px 3px 0 0}.bc small{font-size:9px;color:var(--mute);margin-top:2px}
.lg2{display:flex;gap:12px;font-size:12px;color:var(--mute);margin:6px 0}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.gr{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:5px 0;font-size:14px}
.cdn{display:flex;align-items:center;gap:12px;background:var(--cs);color:var(--c);border-radius:14px;padding:10px 14px;margin-top:14px}.cdn b{font-size:32px;line-height:1}.cdn span{font-size:12px}
.tag.cd{background:var(--dts);color:var(--dt);font-weight:700}
.rem{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.ri{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-left:5px solid var(--c);background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px}
.ra{display:flex;gap:6px;flex-wrap:wrap}
#f_ten{text-transform:uppercase}
.acl{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);max-height:220px;overflow:auto;display:none}
.acl button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:14px}
.acl button+button{border-top:1px solid var(--line)}
/* ===== nâng cấp giao diện v9 ===== */
:root{--sh:0 1px 2px rgba(16,42,51,.05),0 10px 30px -8px rgba(16,42,51,.18)}

.wrap{padding-bottom:104px}@media(min-width:801px){.wrap{padding-bottom:40px}}
.hero{position:relative;overflow:hidden;background:linear-gradient(125deg,#083f46 0,#0e6b6e 55%,#1aa0a4 100%);border-radius:22px;padding:18px 20px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}.hero h1{font-size:22px;letter-spacing:-.01em}

.pt{border-radius:18px;transition:transform .12s;animation:in .25s both}.pt:hover{transform:translateY(-1px)}.pt:active{transform:scale(.985)}
.btn,.fc,.hbtn{min-height:40px}.btn{transition:transform .1s,box-shadow .15s}.btn:active{transform:scale(.97)}
.btn.pri{box-shadow:0 6px 16px -6px rgba(14,107,110,.7)}
input,select,textarea{min-height:44px;font-size:16px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent);outline:0}
.sw input{border-radius:14px}.panel{border-radius:22px;animation:in .25s both}
.fcs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}.fcs::-webkit-scrollbar{display:none}.fc{white-space:nowrap}
details.sec{border-top:1px solid var(--line);margin-top:6px}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--teal);padding:14px 0 8px;cursor:pointer;font-size:15px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s}
details.sec[open]>summary:after{transform:rotate(-135deg)}
.bd{background:var(--teal);color:var(--on);border-radius:99px;font-size:12px;padding:0 8px;line-height:20px}
.ei{width:64px;height:64px;margin:0 auto 10px;border-radius:20px;background:var(--ts);color:var(--teal);display:flex;align-items:center;justify-content:center}.ei .i{width:30px;height:30px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0b2a30;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s;z-index:100;display:flex;gap:8px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.bn{display:none}
@media(max-width:800px){
.hbtn span{display:none}.hbtn{padding:8px 10px}.hero #stbtn,.hero #lk{display:none}
.stats{grid-template-columns:repeat(2,1fr)}
#back{position:sticky;top:8px;z-index:4;box-shadow:var(--sh)}
dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:94vh}
.bn{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:6px}
.bn button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);border-radius:16px;cursor:pointer}
.bn button.on{color:var(--teal)}
.bn .plus{flex:0 0 56px;height:56px;margin-top:-24px;border-radius:50%;background:linear-gradient(135deg,#0e6b6e,#1aa0a4);color:#fff;box-shadow:0 8px 20px -6px rgba(14,107,110,.8);justify-content:center}
.bn .plus .i{width:26px;height:26px}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pbox{min-height:140px;border:2px dashed var(--line);border-radius:14px;margin:10px 0;padding:10px;background:var(--bg)}
.pbox:empty:before{content:"Dán ảnh vào đây";color:var(--mute)}
/* ===== giao diện v11 ===== */
.cchips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.cc{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 13px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer;color:var(--k);border:1.5px solid color-mix(in srgb,var(--k) 40%,transparent);background:color-mix(in srgb,var(--k) 10%,var(--card));transition:transform .1s}
.cc:active{transform:scale(.96)}.cc.on{background:var(--k);color:#fff;border-color:var(--k)}
.cc b{background:var(--k);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;line-height:18px}.cc.on b{background:#fff;color:var(--k)}
.ph{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ph button{border-radius:16px;background:var(--card);transition:transform .15s}.ph button:hover{transform:translateY(-2px)}
.ph img{height:auto;aspect-ratio:1/1;background:var(--bg)}.ph small{padding:6px 10px 8px;font-size:12px}
.panel{border:1px solid color-mix(in srgb,var(--c,var(--line)) 20%,var(--line))}

.ph0 .av.big{width:68px;height:68px;font-size:24px;box-shadow:0 0 0 4px var(--cs)}.panel h2{font-size:23px;letter-spacing:-.01em}
.cdn{background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));color:#fff;box-shadow:0 10px 24px -12px var(--c)}
.cdn b{font-size:38px}.cdn span{opacity:.92;font-size:13px}
.grid>div{border:1px solid var(--line);background:var(--card)}
.grid>div:nth-child(6n+1) span .i{color:#d4543f}.grid>div:nth-child(6n+2) span .i{color:#1d6fd1}.grid>div:nth-child(6n+3) span .i{color:#6d5bd0}
.grid>div:nth-child(6n+4) span .i{color:#2c8f5a}.grid>div:nth-child(6n+5) span .i{color:#d9822b}.grid>div:nth-child(6n) span .i{color:#d9468f}
h3 .i,details.sec>summary .i{width:30px;height:30px;padding:6px;border-radius:10px;background:var(--ts);color:var(--teal)}
.lbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.lbc{margin:8px 0;font-size:13px;color:var(--mute);text-align:center}
dialog img.big{max-height:68vh;object-fit:contain;background:#0b1a1e}
.eps{display:grid;gap:8px}.ep{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;font:inherit;color:inherit}
.ep.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--ts)}.ep b{font-size:14px}
.roB{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--as);color:var(--amb);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}

.grid>.tile{display:block;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;transition:transform .1s}

.rs{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:-4px 2px 10px}
.lnk{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;font-size:13px}
.bar2{display:flex;gap:8px;margin-bottom:10px}.bar2 .sw{flex:1;margin:0}.bar2 .btn{white-space:nowrap}
button.stat{text-align:left;font:inherit;color:inherit;border:0;cursor:pointer;width:100%;background:var(--card)}
button.stat:active{transform:scale(.98)}.stat.on{box-shadow:0 0 0 2px var(--c),var(--sh)}

<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="dq"></dialog>
<div id="toast"></div>
<input type="file" id="qrf" accept="image/*" capture="environment" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pick" accept="image/*" hidden>
<input type="file" id="ocr" accept="image/*" capture="environment" hidden>
<input type="file" id="ocrp" accept="image/*" hidden>
<input type="file" id="imp" accept=".sobn,application/json" hidden>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const E=new TextEncoder(),D=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LG=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const LS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){alert('Không lưu được dữ liệu. Hãy kiểm tra dung lượng máy.')}};
const ld=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return ld(d)},today=()=>day(0);
const diff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5),fmt=d=>d?d.split('-').reverse().join('/'):'—';

/* ---- mã hóa ---- */
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(b,kk){const iv=crypto.getRandomValues(new Uint8Array(12)),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},kk||K,b)),o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return o}
async function open(b){b=new Uint8Array(b);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},K,b.slice(12)))}
const save=async()=>LS('sobn_data',b64(await seal(E.encode(JSON.stringify(S)))));
/* ---- kho ảnh (IndexedDB) ---- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('sobn',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('ph',m),r=f(t.objectStore('ph'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};

async function addPhoto(file){
  const p=S.find(x=>x.id===sel);if(!p||!file)return;
  try{const cls=pend.loai==='cls'||pend.loai==='tt',M=cls?1800:1280,bm=await createImageBitmap(file),k=Math.min(1,M/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',cls?.82:.75)),id=crypto.randomUUID();
    const sealed=await seal(new Uint8Array(await blob.arrayBuffer()));
    await tx('readwrite',s=>s.put({id,d:sealed}));
    (p.ph=p.ph||[]).push({id,ng:today(),loai:pend.loai||'vetmo',nhan:pend.nhan||'Vết mổ'});await save();render();toast('Đã lưu ảnh');
  }catch(e){alert('Không lưu được ảnh: '+e.message)}
}
async function backup(){
  const ph=await tx('readonly',s=>s.getAll()),o={v:1,meta:JSON.parse(LG('sobn_meta')),data:LG('sobn_data'),ph:(ph||[]).map(x=>({id:x.id,d:b64(x.d)}))};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='sao-luu-'+today()+'.sobn';a.click();toast('Đã tạo file sao lưu');
}
async function restore(file){
  try{const o=JSON.parse(await file.text());if(!o.meta||!o.data)throw 0;
    if(!confirm('Nhập sao lưu sẽ THAY THẾ toàn bộ dữ liệu hiện có trên máy này. Tiếp tục?'))return;
    await tx('readwrite',s=>s.clear());for(const x of o.ph)await tx('readwrite',s=>s.put({id:x.id,d:unb(x.d)}));
    LS('sobn_meta',JSON.stringify(o.meta));LS('sobn_data',o.data);skipSnap=true;lockScreen('Đã nhập xong. Mở khóa bằng mật khẩu của bản sao lưu.');
  }catch(e){alert('File sao lưu không hợp lệ.')}
}
